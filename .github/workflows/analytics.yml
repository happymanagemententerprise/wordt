name: Analytics sync

# Pulls the game's analytics events from Render logs into the
# "Wordt Analytics" Google Sheet. Safe to run often: events are de-duplicated,
# so overlapping windows never double-count.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "How far back to look if no cursor is stored yet"
        required: false
        default: "24"
      dry_run:
        description: "Read and compute only; do not write to the sheet"
        type: boolean
        required: false
        default: false

concurrency:
  group: analytics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/pyproject.toml

      - name: Install the analytics package
        run: python -m pip install ./analytics

      - name: Sync events into the sheet
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python -m wordt_analytics \
            --window-hours "${{ github.event.inputs.window_hours || '24' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
